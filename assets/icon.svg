    <rect x="116" y="206" width="48" height="120" rx="8" fill="#34d399"/>
    <line x1="256" y1="120" x2="256" y2="392" stroke="#f87171" stroke-width="14"/>
    <rect x="232" y="176" width="48" height="164" rx="8" fill="#f87171"/>
    <line x1="372" y1="164" x2="372" y2="352" stroke="#34d399" stroke-width="14"/>
    <rect x="348" y="220" width="48" height="96" rx="8" fill="#34d399"/>
